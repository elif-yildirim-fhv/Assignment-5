spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# Game Service Circuit Breaker
resilience4j.circuitbreaker.instances.gameServiceCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.gameServiceCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.gameServiceCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.gameServiceCircuitBreaker.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.gameServiceCircuitBreaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.gameServiceCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.gameServiceCircuitBreaker.sliding-window-type=COUNT_BASED

# Board Service Circuit Breaker
resilience4j.circuitbreaker.instances.boardServiceCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.boardServiceCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.boardServiceCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.boardServiceCircuitBreaker.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.boardServiceCircuitBreaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.boardServiceCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.boardServiceCircuitBreaker.sliding-window-type=COUNT_BASED

# Player Service Circuit Breaker
resilience4j.circuitbreaker.instances.playerServiceCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.playerServiceCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.playerServiceCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.playerServiceCircuitBreaker.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.playerServiceCircuitBreaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.playerServiceCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.playerServiceCircuitBreaker.sliding-window-type=COUNT_BASED

# Timeouts
spring.cloud.gateway.httpclient.connect-timeout=1000
spring.cloud.gateway.httpclient.response-timeout=5s

# Enhanced Logging Configuration
logging.level.root=INFO
logging.level.sem4.ea.ss25.battleship.assignment2=TRACE
logging.level.org.springframework.web.reactive.function.client.ExchangeFunctions=TRACE
logging.level.org.springframework.cloud.gateway=TRACE
logging.level.org.springframework.web.reactive=TRACE
logging.level.reactor.netty.http.client=DEBUG

# Log pattern with thread and class information
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
